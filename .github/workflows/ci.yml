name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run check

      - name: Build TypeScript
        run: npm run build

      - name: Tests
        run: npm run test:ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build container
        run: docker build -t sky-event-ledger:ci .

      - name: Validate Compose
        run: docker compose config
